name: Feature request
description: 提议新的使用场景或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 你在什么场景遇到了什么困难？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 你希望 RepoNest 如何处理？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: dropdown
    id: scope
    attributes:
      label: 功能范围
      options:
        - 收藏与整理
        - GitHub 同步
        - 搜索与发现
        - 导入导出
        - 部署与运维
        - UI / UX
        - 其他
