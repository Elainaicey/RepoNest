name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck && npm run typecheck:api

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh deploy/reponestctl
          bash deploy/reponestctl help >/dev/null

      - name: Test web
        run: npm test

      - name: Test API
        run: npm run test:api

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: Dockerfile
          - name: api
            dockerfile: Dockerfile.api
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build ${{ matrix.name }} container
        run: docker build --file ${{ matrix.dockerfile }} --tag reponest-${{ matrix.name }}:ci .

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          PUBLIC_URL: https://reponest.example.com
          GITHUB_CALLBACK_URL: https://reponest.example.com/api/auth/github/callback
          GITHUB_CLIENT_ID: test-client
          GITHUB_CLIENT_SECRET: test-secret
          TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          POSTGRES_PASSWORD: test-database-password
        run: docker compose config --quiet
