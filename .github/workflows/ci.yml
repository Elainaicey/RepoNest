name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci --prefix server

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck && npm run typecheck:api

      - name: Validate deployment scripts
        run: |
          bash -n deploy/install.sh deploy/reponestctl deploy/docker-entrypoint.sh
          bash deploy/reponestctl help >/dev/null

      - name: Test web
        run: npm test

      - name: Test API
        run: npm run test:api

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build the unified container
        run: docker build --tag reponest:ci .

      - name: Smoke test the complete application
        run: |
          docker run -d --name reponest-ci \
            --tmpfs /data \
            -p 127.0.0.1:3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 \
            -e GITHUB_CLIENT_ID=test-client \
            -e GITHUB_CLIENT_SECRET=test-secret \
            -e TOKEN_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            reponest:ci
          curl --fail --retry 30 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:3000/api/health

      - name: Show application logs
        if: failure()
        run: docker logs reponest-ci

      - name: Remove test container
        if: always()
        run: docker rm -f reponest-ci >/dev/null 2>&1 || true

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate Compose configuration
        env:
          PUBLIC_URL: https://reponest.example.com
          GITHUB_CLIENT_ID: test-client
          GITHUB_CLIENT_SECRET: test-secret
          TOKEN_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: docker compose config --quiet
