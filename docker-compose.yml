services:
  reponest:
    image: ghcr.io/elainaicey/reponest:${REPONEST_VERSION:-latest}
    pull_policy: always
    container_name: reponest
    restart: unless-stopped
    init: true
    ports:
      - "${REPONEST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
