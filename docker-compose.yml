name: reponest

services:
  app:
    image: ghcr.io/elainaicey/reponest:${REPONEST_VERSION:-latest}
    pull_policy: always
    container_name: reponest
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    pids_limit: 256
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:${REPONEST_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_PATH: /data/database
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?Set GITHUB_CLIENT_ID in .env}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?Set GITHUB_CLIENT_SECRET in .env}
      GITHUB_API_VERSION: ${GITHUB_API_VERSION:-2026-03-10}
      OWNER_GITHUB_LOGIN: ${OWNER_GITHUB_LOGIN:-}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?Set TOKEN_ENCRYPTION_KEY in .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      SYNC_INTERVAL_MINUTES: ${SYNC_INTERVAL_MINUTES:-60}
      MAX_SYNC_PAGES: ${MAX_SYNC_PAGES:-50}
    volumes:
      - ${REPONEST_DATA_DIR:-./data}:/data
    tmpfs:
      - /tmp:size=128m,noexec,nosuid
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: ${REPONEST_LOG_MAX_SIZE:-10m}
        max-file: ${REPONEST_LOG_MAX_FILES:-3}
